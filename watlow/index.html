<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screw Plug Heater Pricing Wizard</title>
<style>
:root {
  --primary:#1a365d; --secondary:#2b6cb0; --bg:#f7fafc; --card:#fff;
  --text:#2d3748; --muted:#718096; --border:#e2e8f0; --result:#ebf8ff;
}
* { box-sizing:border-box; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); margin:0; padding:30px 18px 60px; line-height:1.5;
}
.page { max-width:980px; margin:0 auto; }
.topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px; }
.back {
  display:inline-flex; align-items:center; gap:6px; color:var(--secondary); text-decoration:none; font-weight:600;
}
.source { color:var(--muted); font-size:12px; text-align:right; }
.container {
  background:var(--card); border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.08);
  padding:34px;
}
h1 { color:var(--primary); margin:0; text-align:center; font-size:28px; }
.subtitle { text-align:center; color:var(--muted); margin:6px auto 26px; font-size:14px; max-width:720px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:18px 22px; }
.section-title {
  grid-column:1/-1; font-size:15px; font-weight:700; color:var(--primary);
  padding-top:8px; border-top:1px solid var(--border); margin-top:4px;
}
.form-group { min-width:0; }
label { display:block; font-weight:650; margin-bottom:6px; color:#34495e; }
select {
  width:100%; padding:11px 12px; border:1px solid #cbd5e0; border-radius:6px;
  background:#fff; font-size:15px; color:var(--text);
}
select:focus { outline:2px solid rgba(43,108,176,.18); border-color:var(--secondary); }
.hint { color:var(--muted); font-size:12px; margin-top:5px; }
.results {
  margin-top:28px; background:var(--result); border-left:5px solid #3182ce;
  padding:22px; border-radius:8px;
}
.result-row {
  display:grid; grid-template-columns:170px 1fr; gap:10px; padding:7px 0;
  border-bottom:1px solid rgba(49,130,206,.13);
}
.result-row:last-of-type { border-bottom:0; }
.result-label { color:#4a5568; font-weight:600; }
.result-value { color:#1a365d; font-weight:750; overflow-wrap:anywhere; }
.price { font-size:22px; }
.breakdown { color:var(--muted); font-size:12px; margin-top:8px; }
.note {
  margin-top:18px; padding:14px 16px; border:1px solid var(--border); border-radius:7px;
  background:#f8fafc; color:#4a5568; font-size:13px;
}
.copy {
  border:1px solid #a0aec0; background:#fff; color:#2d3748; border-radius:5px;
  padding:5px 10px; margin-left:8px; cursor:pointer; font-size:12px;
}
.empty { color:#c53030; font-weight:650; }
@media (max-width:720px) {
  .container { padding:24px 18px; }
  .grid { grid-template-columns:1fr; }
  .result-row { grid-template-columns:1fr; gap:2px; }
  .topbar { align-items:flex-start; flex-direction:column; }
  .source { text-align:left; }
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="back" href="../index.html">← Back to Heater Pricing Wizard</a>
    <div class="source"></div>
  </div>

  <div class="container">
    <h1>Screw Plug Heater Pricing Wizard</h1>
    <div class="subtitle"></div>

    <div class="grid">
      <div class="section-title">Heater configuration</div>

      <div class="form-group">
        <label for="plug">Plug Size</label>
        <select id="plug"></select>
      </div>

      <div class="form-group">
        <label for="elements">Number of Elements</label>
        <select id="elements"></select>
      </div>

      <div class="form-group">
        <label for="material">Element Type</label>
        <select id="material"></select>
      </div>

      <div class="form-group">
        <label for="voltage">Voltage</label>
        <select id="voltage"></select>
      </div>

      <div class="form-group" style="grid-column:1/-1">
        <label for="kw">kW</label>
        <select id="kw"></select>
        <div class="hint"></div>
      </div>

      <div class="section-title"></div>

      <div class="form-group">
        <label for="enclosure">Enclosure Type</label>
        <select id="enclosure">
          <option value="general">General Purpose</option>
          <option value="moisture">Moisture Resistant</option>
          <option value="explosion">Explosion Resistant</option>
        </select>
      </div>

      <div class="form-group">
        <label for="thermostat">Thermostat</label>
        <select id="thermostat">
          <option value="none">Without Thermostat</option>
          <option value="single">Single Pole Thermostat</option>
          <option value="double">Double Pole Thermostat</option>
        </select>
        <div class="hint"></div>
      </div>

      <div class="form-group">
        <label for="overtemp">Overtemperature Thermocouple</label>
        <select id="overtemp"><option value="no">No</option><option value="yes">Yes</option></select>
        <div class="hint"></div>
      </div>

      <div class="form-group">
        <label for="processTc">Process Thermocouple</label>
        <select id="processTc"><option value="no">No</option><option value="yes">Yes</option></select>
        <div class="hint"></div>
      </div>
    </div>

    <div class="results">
      <div id="noMatch" class="empty" style="display:none">No published heater matches this combination.</div>
      <div id="resultContent">
        <div class="result-row"><div class="result-label">Part Number</div><div class="result-value"><span id="partNumber"></span><button class="copy" id="copyBtn">Copy</button></div></div>
        <div class="result-row"><div class="result-label">Immersion Length</div><div class="result-value" id="immersion"></div></div>
        <div class="result-row"><div class="result-label">Price</div><div class="result-value price" id="price"></div></div>
        <div class="breakdown" id="breakdown"></div>
      </div>
    </div>

    <div class="note" id="orderNote">
     
    </div>
  </div>
</div>

"price":1886.0,"code":"BLNF54L22","style":"FIREBAR","application":"Bunker C / #6 Fuel Oils / Asphalt","wattDensity":"8 W/in\u00b2","series":"BLNF","id":375},{"plug":"2.5","elements":3,"material":"Incoloy","voltage":480,"kw":5.38,"mm":1388,"price":1886.0,"code":"BLNF54L21","style":"FIREBAR","application":"Bunker C / #6 Fuel Oils / Asphalt","wattDensity":"8 W/in\u00b2","series":"BLNF","id":376}];

const $ = id => document.getElementById(id);
const selects = ["plug","elements","material","voltage","kw","enclosure","thermostat","overtemp","processTc"];

function uniq(arr) { return [...new Set(arr)]; }
function numericSort(a,b) { return Number(a)-Number(b); }

function replaceOptions(el, options, preferred) {
  const old = preferred ?? el.value;
  el.innerHTML = "";
  options.forEach(o => {
    const opt = document.createElement("option");
    opt.value = String(o.value);
    opt.textContent = o.label;
    el.appendChild(opt);
  });
  if ([...el.options].some(o => o.value === String(old))) el.value = String(old);
}

function rowsFor(filters) {
  return heaters.filter(r => Object.entries(filters).every(([k,v]) => String(r[k]) === String(v)));
}

function syncPrimary() {
  const plugEl = $("plug");
  if (!plugEl.options.length) {
    replaceOptions(plugEl, uniq(heaters.map(r=>r.plug)).sort(numericSort).map(v=>({value:v,label:v+"” NPT"})), "1");
  }

  const plug = plugEl.value;
  const elementVals = uniq(rowsFor({plug}).map(r=>r.elements)).sort(numericSort);
  replaceOptions($("elements"), elementVals.map(v=>({value:v,label:String(v)})));

  const elements = $("elements").value;
  const materialVals = uniq(rowsFor({plug,elements}).map(r=>r.material));
  const matOrder = ["Copper","Incoloy","316SS"];
  materialVals.sort((a,b)=>matOrder.indexOf(a)-matOrder.indexOf(b));
  replaceOptions($("material"), materialVals.map(v=>({value:v,label:v==="316SS"?"316SS":v})));

  const material = $("material").value;
  const voltageVals = uniq(rowsFor({plug,elements,material}).map(r=>r.voltage)).sort(numericSort);
  replaceOptions($("voltage"), voltageVals.map(v=>({value:v,label:v+"V"})));

  syncKw();
}

function syncKw() {
  const filters = {
    plug:$("plug").value,
    elements:$("elements").value,
    material:$("material").value,
    voltage:$("voltage").value
  };
  let rows = rowsFor(filters);
  rows.sort((a,b)=>a.kw-b.kw || a.style.localeCompare(b.style) || a.application.localeCompare(b.application));
  const counts = {};
  rows.forEach(r => counts[r.kw] = (counts[r.kw]||0)+1);
  replaceOptions($("kw"), rows.map(r=>({
    value:r.id,
    label:`${Number.isInteger(r.kw)?r.kw.toFixed(1):r.kw} kW — ${r.style} · ${r.application} · ${r.wattDensity}`
  })));
  updateResult();
}

function optionInfo(plug, enclosure, thermostat) {
  const small = (plug==="1" || plug==="1.25");
  const table = {
    small: {
      none:   {general:["",0], moisture:["W",153], explosion:["E",153], label:"Without thermostat"},
      single: {general:["S2",95], moisture:["W2",166], explosion:["E2",330], label:"Single pole Type 2 (30–250°F)"},
      double: {general:["S5A",296], moisture:["W5A",493], explosion:["E5A",669], label:"Double pole Type 5A (60–250°F)"}
    },
    large: {
      none:   {general:["",0], moisture:["W",160], explosion:["E",160], label:"Without thermostat"},
      single: {general:["S2",250], moisture:["W2",371], explosion:["E2",576], label:"Single pole Type 2 (30–250°F)"},
      double: {general:["S5",296], moisture:["W5",493], explosion:["E5",669], label:"Double pole Type 5 (60–250°F)"}
    }
  };
  const group = small ? table.small : table.large;
  const [suffix,adder] = group[thermostat][enclosure];
  return {suffix,adder,label:group[thermostat].label};
}

function fractionLength(mm) {
  const inches = mm / 25.4;
  let whole = Math.floor(inches + 1e-9);
  let num = Math.round((inches-whole)*16);
  if (num===16) { whole++; num=0; }
  if (!num) return `${whole} in (${mm} mm)`;
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  const g=gcd(num,16);
  return `${whole ? whole+" " : ""}${num/g}/${16/g} in (${mm} mm)`;
}

function money(n) {
  return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2}).format(n);
}

function updateResult() {
  const id = Number($("kw").value);
  const r = heaters.find(x=>x.id===id);
  if (!r) {
    $("noMatch").style.display="block";
    $("resultContent").style.display="none";
    return;
  }
  $("noMatch").style.display="none";
  $("resultContent").style.display="block";

  const opt = optionInfo(r.plug,$("enclosure").value,$("thermostat").value);
  const ot = $("overtemp").value==="yes";
  const pt = $("processTc").value==="yes";
  const otAdder = ot ? 226 : 0;
  const ptAdder = pt ? 187 : 0;
  const tcSuffix = (ot ? "J" : "") + (pt ? "J" : "");
  const part = r.code + opt.suffix + tcSuffix;
  const total = r.price + opt.adder + otAdder + ptAdder;

  $("partNumber").textContent = part;
  $("immersion").textContent = fractionLength(r.mm);
  $("price").textContent = money(total);
  $("breakdown").textContent =
    `Base heater ${money(r.price)} + enclosure/thermostat ${money(opt.adder)}` +
    `${ot ? " + overtemperature Type J "+money(226) : ""}` +
    `${pt ? " + process Type J "+money(187) : ""}` +
    ` · ${opt.label}`;

  $("orderNote").innerHTML =
    ` ` +
    `` +
    `${ot ? "" : ""}` +
    ``;
}

$("plug").addEventListener("change", syncPrimary);
$("elements").addEventListener("change", () => {
  const plug=$("plug").value, elements=$("elements").value;
  const materialVals=uniq(rowsFor({plug,elements}).map(r=>r.material));
  const matOrder=["Copper","Incoloy","316SS"]; materialVals.sort((a,b)=>matOrder.indexOf(a)-matOrder.indexOf(b));
  replaceOptions($("material"), materialVals.map(v=>({value:v,label:v})));
  const material=$("material").value;
  const vs=uniq(rowsFor({plug,elements,material}).map(r=>r.voltage)).sort(numericSort);
  replaceOptions($("voltage"),vs.map(v=>({value:v,label:v+"V"})));
  syncKw();
});
$("material").addEventListener("change", () => {
  const plug=$("plug").value, elements=$("elements").value, material=$("material").value;
  const vs=uniq(rowsFor({plug,elements,material}).map(r=>r.voltage)).sort(numericSort);
  replaceOptions($("voltage"),vs.map(v=>({value:v,label:v+"V"})));
  syncKw();
});
$("voltage").addEventListener("change",syncKw);
$("kw").addEventListener("change",updateResult);
["enclosure","thermostat","overtemp","processTc"].forEach(id => $(id).addEventListener("change",updateResult));

$("copyBtn").addEventListener("click", async () => {
  const text=$("partNumber").textContent;
  try { await navigator.clipboard.writeText(text); } catch(e) {
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  const b=$("copyBtn"); const old=b.textContent; b.textContent="Copied"; setTimeout(()=>b.textContent=old,1200);
});

syncPrimary();
