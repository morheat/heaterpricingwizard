 if((cfg.phaseMode==='singleOptional3_10'||cfg.phaseMode==='singleOptional3_10_end')&&phase==='3')p*=1.10;
 if(thEl) p+=Number(thEl.options[thEl.selectedIndex].dataset.adder||0);
 const mh=document.getElementById('metalHead'); if(mh&&mh.checked)p+=Number(cfg.metalHeadAdder||0);
 const typ=document.getElementById('riserType'); if(typ){const vl=Number(document.getElementById('vertical').value),std=Number(r.length||0); if(typ.value==='rigid'&&vl>std)p+=(vl-std)*Number(cfg.verticalAdder||0); if(typ.value==='flex'){p+=220;if(vl>48)p+=((vl-48)/12)*87;}}
 const deep=document.getElementById('deepRiser'); if(deep){const v=Math.max(12,Number(deep.value)||12);p+=v*Number(cfg.riserAdder||0);}
 const plug=document.getElementById('plug'); if(plug&&plug.checked)p+=44;
 const conduit=document.getElementById('conduit'); if(conduit&&Number(conduit.value)>36)p+=((Number(conduit.value)-36)/12)*4;
 const model=buildModel(r,phase,thermal); const amps=(phase==='3'?Number(r.watts)/(Number(r.voltage)*Math.sqrt(3)):Number(r.watts)/Number(r.voltage));
 const parts=["Metal Derated Over-the-Side Heater",cfg.material,`${r.voltage}V`,phase==='3'?'Three Phase':'Single Phase',`${r.watts}W`]; if(r.hotzone)parts.push(`${r.hotzone} in. hot zone`); if(r.length)parts.push(`${r.length} in. length`); if(thermal&&thEl){const thermalText=thEl.options[thEl.selectedIndex].textContent;const tm=thermalText.match(/^\S+\s+(Replaceable|Resettable),\s*(.+)$/i);parts.push(tm?`${thermal} ${tm[1]} Fuse (${tm[2]})`:`${thermal} Fuse`);} if(mh&&mh.checked)parts.push('welded metal head'); if(typ)parts.push(`${document.getElementById('vertical').value} in. ${typ.value==='flex'?'flexible':'rigid'} riser`); if(deep)parts.push(`${deep.value} in. vertical riser`); if(plug&&plug.checked)parts.push('plug-in heater option'); if(conduit)parts.push(`${conduit.value} in. leads/conduit`);
 document.getElementById('out-part').innerText=model; document.getElementById('out-amps').innerText=amps.toFixed(2); document.getElementById('out-price').innerText=money(p); document.getElementById('out-dist-price').innerText=money(p*0.65); document.getElementById('out-desc').innerText=parts.join(', ');
 const b=document.getElementById('copy-btn');b.innerText='Copy';b.classList.remove('copied');
}
function copyPart(){const t=document.getElementById('out-part').innerText; navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById('copy-btn');b.innerText='Copied!';b.classList.add('copied');setTimeout(()=>{b.innerText='Copy';b.classList.remove('copied')},2000)})}
window.onload=init;
