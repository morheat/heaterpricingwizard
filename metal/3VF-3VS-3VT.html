</style></head><body><div class="container">

<h1>3VF / 3VS / 3VT Series Pricing Wizard</h1><div class="subtitle" id="subtitle">Deep Tank Heater</div>
<div class="form-group"><label for="material">Material</label><select id="material" onchange="changeMaterial()"><option value="0">304 Stainless (3VF)</option><option value="1">316 Stainless (3VS)</option><option value="2">Titanium (3VT)</option></select></div>
<div class="form-group"><label for="wattage">Wattage (W)</label><select id="wattage" onchange="updateVoltages()"></select></div>
<div class="form-group"><label for="voltage">Voltage (V)</label><select id="voltage" onchange="updateRecord()"></select></div>
<div class="form-group"><label for="phase">Phase</label><select id="phase" onchange="calculate()"><option value="3">Three Phase</option></select></div>
<div class="form-group" id="thermal-group"><label for="thermal">Thermal Overload Protection</label><select id="thermal" onchange="calculate()"><option value="P2" data-adder="0">P2 Resettable, up to 180°F</option></select></div><div class="form-group"><label for="deepRiser">Vertical Riser Length (inches, 12 minimum)</label><input id="deepRiser" type="number" min="12" value="12" step="1" oninput="calculate()"></div><div class="form-group"><label for="conduit">Lead / Conduit Length (inches)</label><input type="number" id="conduit" value="36" min="36" step="1" oninput="calculate()"></div>
<div class="results"><div>Part Number: <span id="out-part" style="margin-left:5px"></span><button id="copy-btn" onclick="copyPart()">Copy</button></div><div>Amps: <span id="out-amps" style="margin-left:5px"></span> A</div><div>Retail Price: $<span id="out-price" style="margin-left:5px"></span></div><div>Distributor Price: $<span id="out-dist-price" style="margin-left:5px"></span></div><div class="description-box"><strong>Description:</strong><br><span id="out-desc"></span></div></div>
</div><script>
const materialCfgs=[{"code": "3VF", "category": "Deep tank heaters", "title": "3VF Series Triple Metal Deep Tank Heater", "material": "304 Stainless", "records": [{"watts": 18000, "voltage": 240, "model": "3VF18236-**", "price": 1592.0, "length": 36}, {"watts": 18000, "voltage": 480, "model": "3VF18436-**", "price": 1592.0, "length": 36}, {"watts": 24000, "voltage": 240, "model": "3VF24244-**", "price": 1886.0, "length": 44}, {"watts": 24000, "voltage": 480, "model": "3VF24444-**", "price": 1886.0, "length": 44}, {"watts": 27000, "voltage": 480, "model": "3VF27450-**", "price": 2057.0, "length": 50}, {"watts": 30000, "voltage": 480, "model": "3VF30455-**", "price": 2414.0, "length": 55}, {"watts": 36000, "voltage": 480, "model": "3VF36464-**", "price": 2634.0, "length": 64}, {"watts": 45000, "voltage": 480, "model": "3VF45477-**", "price": 3170.0, "length": 77}, {"watts": 48000, "voltage": 480, "model": "3VF48482-**", "price": 3347.0, "length": 82}, {"watts": 54000, "voltage": 480, "model": "3VF54491-**", "price": 3707.0, "length": 91}], "phaseMode": "fixed3", "thermal": "fixedP2", "modelMode": "thermalDouble", "riser": true, "riserAdder": 8, "conduit": true, "notes": "Three phase standard. P2 thermal protection is standard. Minimum riser is 12 in.; pricing adds $8 per vertical riser inch for stainless steel and $15/in. for titanium. Some high-wattage models are not UL listed. 2022 list pricing. Standard heaters are supplied with 36 in. leads/conduit; extra length is $4.00 per foot over 36 in. and uses -X plus total inches in the model number."}, {"code": "3VS", "category": "Deep tank heaters", "title": "3VS Series Triple Metal Deep Tank Heater", "material": "316 Stainless", "records": [{"watts": 18000, "voltage": 240, "model": "3VS18236-**", "price": 1781.0, "length": 36}, {"watts": 18000, "voltage": 480, "model": "3VS18436-**", "price": 1781.0, "length": 36}, {"watts": 24000, "voltage": 240, "model": "3VS24244-**", "price": 2028.0, "length": 44}, {"watts": 24000, "voltage": 480, "model": "3VS24444-**", "price": 2028.0, "length": 44}, {"watts": 27000, "voltage": 480, "model": "3VS27450-**", "price": 2252.0, "length": 50}, {"watts": 30000, "voltage": 480, "model": "3VS30455-**", "price": 2845.0, "length": 55}, {"watts": 36000, "voltage": 480, "model": "3VS36464-**", "price": 3258.0, "length": 64}, {"watts": 45000, "voltage": 480, "model": "3VS45477-**", "price": 3994.0, "length": 77}, {"watts": 48000, "voltage": 480, "model": "3VS48482-**", "price": 4260.0, "length": 82}, {"watts": 54000, "voltage": 480, "model": "3VS54491-**", "price": 4723.0, "length": 91}], "phaseMode": "fixed3", "thermal": "fixedP2", "modelMode": "thermalDouble", "riser": true, "riserAdder": 8, "conduit": true, "notes": "Three phase standard. P2 thermal protection is standard. Minimum riser is 12 in.; pricing adds $8 per vertical riser inch for stainless steel and $15/in. for titanium. Some high-wattage models are not UL listed. 2022 list pricing. Standard heaters are supplied with 36 in. leads/conduit; extra length is $4.00 per foot over 36 in. and uses -X plus total inches in the model number."}, {"code": "3VT", "category": "Deep tank heaters", "title": "3VT Series Triple Metal Deep Tank Heater", "material": "Titanium", "records": [{"watts": 18000, "voltage": 240, "model": "3VT18236-**", "price": 2717.0, "length": 36}, {"watts": 18000, "voltage": 480, "model": "3VT18436-**", "price": 2717.0, "length": 36}, {"watts": 24000, "voltage": 240, "model": "3VT24244-**", "price": 3139.0, "length": 44}, {"watts": 24000, "voltage": 480, "model": "3VT24444-**", "price": 3139.0, "length": 44}, {"watts": 27000, "voltage": 480, "model": "3VT27450-**", "price": 3444.0, "length": 50}, {"watts": 30000, "voltage": 480, "model": "3VT30455-**", "price": 4087.0, "length": 55}, {"watts": 36000, "voltage": 480, "model": "3VT36464-**", "price": 4902.0, "length": 64}, {"watts": 45000, "voltage": 480, "model": "3VT45477-**", "price": 5943.0, "length": 77}, {"watts": 48000, "voltage": 480, "model": "3VT48482-**", "price": 6308.0, "length": 82}, {"watts": 54000, "voltage": 480, "model": "3VT54491-**", "price": 7028.0, "length": 91}], "phaseMode": "fixed3", "thermal": "fixedP2", "modelMode": "thermalDouble", "riser": true, "riserAdder": 15, "conduit": true, "notes": "Three phase standard. P2 thermal protection is standard. Minimum riser is 12 in.; pricing adds $8 per vertical riser inch for stainless steel and $15/in. for titanium. Some high-wattage models are not UL listed. 2022 list pricing. Standard heaters are supplied with 36 in. leads/conduit; extra length is $4.00 per foot over 36 in. and uses -X plus total inches in the model number."}];
let cfg=materialCfgs[0];
function changeMaterial(){
 cfg=materialCfgs[Number(document.getElementById("material").value)];
 document.getElementById("subtitle").textContent="Deep Tank Heater";
 const phase=document.getElementById("phase"); if(phase){ phase.disabled=false; }
 const thermal=document.getElementById("thermal"); if(thermal){ thermal.disabled=false; }
 init();
}
function money(n){return Number(n).toFixed(2)}
function unique(a){return [...new Set(a)]}
function init(){
 const sub=document.getElementById("subtitle"); if(sub) sub.textContent="Deep Tank Heater";
 const mhLabel=document.getElementById("metalHeadLabel"); if(mhLabel && cfg.metalHeadAdder!=null) mhLabel.textContent="Welded metal head (+$"+cfg.metalHeadAdder+")";
 const ws=unique(cfg.records.map(r=>r.watts)); const el=document.getElementById('wattage'); el.innerHTML=ws.map(w=>`<option value="${w}">${w}</option>`).join(''); updateVoltages();
}
function updateVoltages(){
 const w=Number(document.getElementById('wattage').value); const rs=cfg.records.filter(r=>Number(r.watts)===w); const vs=unique(rs.map(r=>r.voltage)); document.getElementById('voltage').innerHTML=vs.map(v=>`<option value="${v}">${v}V</option>`).join(''); updateRecord();
}
function currentRecord(){const w=Number(document.getElementById('wattage').value),v=Number(document.getElementById('voltage').value); return cfg.records.find(r=>Number(r.watts)===w && Number(r.voltage)===v)}
function updateRecord(){
 const r=currentRecord(); if(!r)return;
 const vertical=document.getElementById('vertical'); if(vertical){vertical.value=r.length||12; vertical.min=r.length||1;}
 const deep=document.getElementById('deepRiser'); if(deep) deep.value=12;
 const plug=document.getElementById('plug'); if(plug){const ok=(Number(r.voltage)===120 && (Number(r.watts)===500||Number(r.watts)===1000)); plug.disabled=!ok; if(!ok)plug.checked=false;}
 calculate();
}
function metalHeadChanged(){
 const mh=document.getElementById('metalHead'),th=document.getElementById('thermal'); if(mh&&th&&mh.checked){th.value='P2'; th.disabled=true;} else if(th) th.disabled=false; calculate();
}
function updateRiser(){
 const typ=document.getElementById('riserType'),v=document.getElementById('vertical'),th=document.getElementById('thermal'),r=currentRecord(); if(!typ||!v||!r)return;
 if(typ.value==='flex'){v.min=48; if(Number(v.value)<48)v.value=48; if(th){th.value='P2';th.disabled=true;}} else {v.min=r.length||1; if(Number(v.value)<Number(r.length||1))v.value=r.length||1; if(th)th.disabled=false;}
 calculate();
}
function buildModel(r,phase,thermal){
 let m=r.model;
 if(cfg.modelMode==='starPhaseThermal'){
   if(cfg.phaseMode==='singleOptional3_10'){m=m.replace('-*-**', phase==='3' ? '-3-'+thermal : '-'+thermal);}
   else {m=m.replace('-*-**','-'+phase+'-'+thermal);}
 } else if(cfg.modelMode==='lShape'){
   const typ=document.getElementById('riserType').value; const vl=Number(document.getElementById('vertical').value); m=m.replace('R*', typ==='flex'?'FR':'R'+vl); m=m.replace('**',thermal);
   if(phase==='3' && cfg.phaseMode==='singleOptional3_10') m=m.replace('-'+thermal,'-3-'+thermal);
   if(phase==='1' && cfg.phaseMode==='threeOptional1') m=m.replace('-'+thermal,'-1-'+thermal);
 } else if(cfg.modelMode==='thermalDouble'){
   m=m.replace('**',thermal);
   if(phase==='3' && (cfg.phaseMode==='singleOptional3'||cfg.phaseMode==='singleOptional3_10')) m=m.replace('-'+thermal,'-3-'+thermal);
   if(phase==='1' && cfg.phaseMode==='threeOptional1') m=m.replace('-'+thermal,'-1-'+thermal);
 } else if(cfg.modelMode==='thermalSingle'){
   m=m.replace('*',thermal);
   if(phase==='1' && cfg.phaseMode==='threeOptional1') m=m.replace('-'+thermal,'-1-'+thermal);
 } else if(cfg.modelMode==='fixedP4'){
   if(thermal==='P6')m=m.replace('P4','P6'); if(phase==='3')m=m.replace('-'+thermal,'-3-'+thermal);
 }
 if(cfg.phaseMode==='singleOptional3_10_end' && phase==='3')m+='-3';
 if(cfg.phaseMode==='threeOptional1_end' && phase==='1')m+='-1';
 const mh=document.getElementById('metalHead'); if(mh&&mh.checked&&!m.includes('M-')) m=m.replace('-', 'M-',1);
 const conduit=document.getElementById('conduit'); if(conduit&&Number(conduit.value)>36)m+='-X'+Math.round(Number(conduit.value));
 return m;
}
function calculate(){
 const r=currentRecord(); if(!r)return; const phase=document.getElementById('phase').value; const thEl=document.getElementById('thermal'); let thermal=thEl?thEl.value:'';
 if(cfg.special9HS && Number(r.watts)===31500 && Number(r.voltage)===240){thermal='P2'; if(thEl){thEl.value='P2'; thEl.disabled=true;}} else if(thEl && !(document.getElementById('metalHead')&&document.getElementById('metalHead').checked) && !(document.getElementById('riserType')&&document.getElementById('riserType').value==='flex')) thEl.disabled=false;
 let p=Number(r.price);
 if((cfg.phaseMode==='singleOptional3_10'||cfg.phaseMode==='singleOptional3_10_end')&&phase==='3')p*=1.10;
 if(thEl) p+=Number(thEl.options[thEl.selectedIndex].dataset.adder||0);
 const mh=document.getElementById('metalHead'); if(mh&&mh.checked)p+=Number(cfg.metalHeadAdder||0);
 const typ=document.getElementById('riserType'); if(typ){const vl=Number(document.getElementById('vertical').value),std=Number(r.length||0); if(typ.value==='rigid'&&vl>std)p+=(vl-std)*Number(cfg.verticalAdder||0); if(typ.value==='flex'){p+=220;if(vl>48)p+=((vl-48)/12)*87;}}
 const deep=document.getElementById('deepRiser'); if(deep){const v=Math.max(12,Number(deep.value)||12);p+=v*Number(cfg.riserAdder||0);}
 const plug=document.getElementById('plug'); if(plug&&plug.checked)p+=44;
 const conduit=document.getElementById('conduit'); if(conduit&&Number(conduit.value)>36)p+=((Number(conduit.value)-36)/12)*4;
 const model=buildModel(r,phase,thermal); const amps=(phase==='3'?Number(r.watts)/(Number(r.voltage)*Math.sqrt(3)):Number(r.watts)/Number(r.voltage));
 const parts=["Deep Tank Heater",cfg.material,`${r.voltage}V`,phase==='3'?'Three Phase':'Single Phase',`${r.watts}W`]; if(r.hotzone)parts.push(`${r.hotzone} in. hot zone`); if(r.length)parts.push(`${r.length} in. length`); if(thermal&&thEl){const thermalText=thEl.options[thEl.selectedIndex].textContent;const tm=thermalText.match(/^\S+\s+(Replaceable|Resettable),\s*(.+)$/i);parts.push(tm?`${thermal} ${tm[1]} Fuse (${tm[2]})`:`${thermal} Fuse`);} if(mh&&mh.checked)parts.push('welded metal head'); if(typ)parts.push(`${document.getElementById('vertical').value} in. ${typ.value==='flex'?'flexible':'rigid'} riser`); if(deep)parts.push(`${deep.value} in. vertical riser`); if(plug&&plug.checked)parts.push('plug-in heater option'); if(conduit)parts.push(`${conduit.value} in. leads/conduit`);
 document.getElementById('out-part').innerText=model; document.getElementById('out-amps').innerText=amps.toFixed(2); document.getElementById('out-price').innerText=money(p); document.getElementById('out-dist-price').innerText=money(p*0.65); document.getElementById('out-desc').innerText=parts.join(', ');
 const b=document.getElementById('copy-btn');b.innerText='Copy';b.classList.remove('copied');
}
function copyPart(){const t=document.getElementById('out-part').innerText; navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById('copy-btn');b.innerText='Copied!';b.classList.add('copied');setTimeout(()=>{b.innerText='Copy';b.classList.remove('copied')},2000)})}
window.onload=init;
</script></body></html>
