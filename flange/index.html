<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flange Immersion Heater Pricing Wizard</title>
<style>
:root {
  --primary:#1a365d; --secondary:#2b6cb0; --bg:#f7fafc; --card:#fff;
  --text:#2d3748; --muted:#718096; --border:#e2e8f0; --result:#ebf8ff;
}
* { box-sizing:border-box; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); margin:0; padding:30px 18px 60px; line-height:1.5;
}
.page { max-width:980px; margin:0 auto; }
.topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px; }
.back { display:inline-flex; align-items:center; gap:6px; color:var(--secondary); text-decoration:none; font-weight:600; }
.source { color:var(--muted); font-size:12px; text-align:right; }
.container { background:var(--card); border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.08); padding:34px; }
h1 { color:var(--primary); margin:0; text-align:center; font-size:28px; }
.subtitle { text-align:center; color:var(--muted); margin:6px auto 26px; font-size:14px; max-width:720px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:18px 22px; }
.section-title {
  grid-column:1/-1; font-size:15px; font-weight:700; color:var(--primary);
  padding-top:8px; border-top:1px solid var(--border); margin-top:4px;
}
.form-group { min-width:0; }
label { display:block; font-weight:650; margin-bottom:6px; color:#34495e; }
select {
  width:100%; padding:11px 12px; border:1px solid #cbd5e0; border-radius:6px;
  background:#fff; font-size:15px; color:var(--text);
}
select:focus { outline:2px solid rgba(43,108,176,.18); border-color:var(--secondary); }
.hint { color:var(--muted); font-size:12px; margin-top:5px; }
.results {
  margin-top:28px; background:var(--result); border-left:5px solid #3182ce;
  padding:22px; border-radius:8px;
}
.result-row {
  display:grid; grid-template-columns:170px 1fr; gap:10px; padding:7px 0;
  border-bottom:1px solid rgba(49,130,206,.13);
}
.result-row:last-of-type { border-bottom:0; }
.result-label { color:#4a5568; font-weight:600; }
.result-value { color:#1a365d; font-weight:750; overflow-wrap:anywhere; }
.price { font-size:22px; }
.breakdown { color:var(--muted); font-size:12px; margin-top:8px; }
.note {
  margin-top:18px; padding:14px 16px; border:1px solid var(--border); border-radius:7px;
  background:#f8fafc; color:#4a5568; font-size:13px;
}
.copy {
  border:1px solid #a0aec0; background:#fff; color:#2d3748; border-radius:5px;
  padding:5px 10px; margin-left:8px; cursor:pointer; font-size:12px;
}
.empty { color:#c53030; font-weight:650; }
@media (max-width:720px) {
  .container { padding:24px 18px; }
  .grid { grid-template-columns:1fr; }
  .result-row { grid-template-columns:1fr; gap:2px; }
  .topbar { align-items:flex-start; flex-direction:column; }
  .source { text-align:left; }
}
</style>
</head>

        <div class="breakdown" id="breakdown"></div>
      </div>
    </div>

    <div class="note" id="orderNote"></div>
  </div>
</div>

  gpSingle:{"2":86,"2.5":91,"3":254,"4":181,"5":181,"6":181,"8":181,"10":181,"12":181,"14":181},
  gpDouble:{"3":412,"4":361,"5":361,"6":361,"8":361,"10":361,"12":361,"14":361},

  erSingle:{"3":575,"4":679,"5":679,"6":825,"8":958,"10":1100,"12":1208,"14":1271},
  mrDouble:{"3":493,"4":744,"5":744,"6":782,"8":823,"10":1021,"12":1087,"14":1194},

};

const $ = id => document.getElementById(id);
function uniq(arr) { return [...new Set(arr)]; }
function numericSort(a,b) { return Number(a)-Number(b); }
function flangeKey(v) { return String(Number(v)); }

function replaceOptions(el, options, preferred) {
  const old = preferred ?? el.value;
  el.innerHTML = "";
  options.forEach(o => {
    const opt = document.createElement("option");
    opt.value = String(o.value);
    opt.textContent = o.label;
    el.appendChild(opt);
  });
  if ([...el.options].some(o => o.value === String(old))) el.value = String(old);
}

function rowsFor(filters) {
  return heaters.filter(r => Object.entries(filters).every(([k,v]) => String(r[k]) === String(v)));
}

function flangeLabel(v) {
  const n=Number(v);
  return (n===2.5 ? '2.5' : String(n)) + '”';
}

function syncPrimary() {
  const f=$("flange");
  if (!f.options.length) {
    const vals=uniq(heaters.map(r=>r.flange)).sort(numericSort);
    replaceOptions(f,vals.map(v=>({value:v,label:flangeLabel(v)})));
  }
  const flange=f.value;

  const els=uniq(rowsFor({flange}).map(r=>r.elements)).sort(numericSort);
  replaceOptions($("elements"),els.map(v=>({value:v,label:String(v)})));

  syncAfterElements();
}

function syncAfterElements() {
  const flange=$("flange").value, elements=$("elements").value;
  const mats=uniq(rowsFor({flange,elements}).map(r=>r.material));
  const order=["Copper","Incoloy","Steel","304SS","316SS"];
  mats.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  replaceOptions($("material"),mats.map(v=>({value:v,label:v})));
  syncAfterMaterial();
}

function syncAfterMaterial() {
  const flange=$("flange").value, elements=$("elements").value, material=$("material").value;
  const vs=uniq(rowsFor({flange,elements,material}).map(r=>r.voltage)).sort(numericSort);
  replaceOptions($("voltage"),vs.map(v=>({value:v,label:v+"V"})));
  syncAfterVoltage();
}

function syncAfterVoltage() {
  const filters={flange:$("flange").value,elements:$("elements").value,material:$("material").value,voltage:$("voltage").value};
  const ps=uniq(rowsFor(filters).map(r=>r.phase)).sort(numericSort);
  replaceOptions($("phase"),ps.map(v=>({value:v,label:v+"-Phase"})));
  syncKw();
}

function syncKw() {
  const filters={
    flange:$("flange").value,
    elements:$("elements").value,
    material:$("material").value,
    voltage:$("voltage").value,
    phase:$("phase").value
  };
  let rows=rowsFor(filters).slice().sort((a,b)=>a.kw-b.kw || a.id-b.id);
  const unique=[];
  const seen=new Set();
  rows.forEach(r=>{
    const key=String(r.kw);
    if (!seen.has(key)) { seen.add(key); unique.push(r); }
  });
  replaceOptions($("kw"),unique.map(r=>({
    value:r.id,
    label:Number.isInteger(r.kw)?r.kw.toFixed(1):String(r.kw)
  })));
  syncOptionAvailability();
  updateResult();
}

function thermostatChoices(flange) {
  const n=Number(flange);
  const opts=[
    {value:"none",label:"Without Thermostat"},
    {value:"single",label:"Single Pole Thermostat"}
  ];
  if (n>=3) opts.push({value:"double",label:"Double Pole Thermostat"});
  return opts;
}

function enclosureChoices(flange) {
  const n=Number(flange);
  const opts=[{value:"general",label:"General Purpose"}];
  if (n>=3) {
    opts.push({value:"moisture",label:"Moisture Resistant"});
    opts.push({value:"explosion",label:"Explosion Resistant"});
  }
  return opts;
}

function syncOptionAvailability() {
  const flange=$("flange").value;
  replaceOptions($("thermostat"),thermostatChoices(flange));
  replaceOptions($("enclosure"),enclosureChoices(flange));
}

function optionInfo(flange,enclosure,thermostat) {
  const k=flangeKey(flange);
  if (thermostat==="none") {
    if (enclosure==="general") return {suffix:"",adder:0,label:"Without thermostat"};
    if (enclosure==="moisture") return {suffix:"W",adder:optionTables.mrNone[k],label:"Without thermostat"};
    return {suffix:"E",adder:optionTables.erNone[k],label:"Without thermostat"};
  }
  if (thermostat==="single") {
    if (enclosure==="general") return {suffix:"S2",adder:optionTables.gpSingle[k],label:"Single pole Type 2 (30–250°F)"};
    if (enclosure==="moisture") return {suffix:"W2",adder:optionTables.mrSingle[k],label:"Single pole Type 2 (30–250°F)"};
    return {suffix:"E2",adder:optionTables.erSingle[k],label:"Single pole Type 2 (30–250°F)"};
  }
  if (enclosure==="general") return {suffix:"S5",adder:optionTables.gpDouble[k],label:"Double pole Type 5 (60–250°F)"};
  if (enclosure==="moisture") return {suffix:"W5",adder:optionTables.mrDouble[k],label:"Double pole Type 5 (60–250°F)"};
  return {suffix:"E5",adder:optionTables.erDouble[k],label:"Double pole Type 5 (60–250°F)"};
}

function fractionLength(mm) {
  const inches=mm/25.4;
  let whole=Math.floor(inches+1e-9);
  let num=Math.round((inches-whole)*16);
  if (num===16) { whole++; num=0; }
  if (!num) return `${whole} in (${mm} mm)`;
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  const g=gcd(num,16);
  return `${whole?whole+" ":""}${num/g}/${16/g} in (${mm} mm)`;
}

function money(n) {
  return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2}).format(n);
}

function updateResult() {
  const id=Number($("kw").value);
  const r=heaters.find(x=>x.id===id);
  if (!r) {
    $("noMatch").style.display="block";
    $("resultContent").style.display="none";
    return;
  }
  $("noMatch").style.display="none";
  $("resultContent").style.display="block";

  const opt=optionInfo(r.flange,$("enclosure").value,$("thermostat").value);
  const ot=$("overtemp").value==="yes";
  const pt=$("processTc").value==="yes";
  const otAdder=ot?215:0;
  const ptAdder=pt?178:0;
  const tcSuffix=(ot?"J":"")+(pt?"J":"");
  const part=r.code+opt.suffix+tcSuffix;
  const total=r.price+opt.adder+otAdder+ptAdder;

  $("partNumber").textContent=part;
  $("immersion").textContent=fractionLength(r.mm);
  $("price").textContent=money(total);
  $("breakdown").textContent=
    `Base heater ${money(r.price)} + enclosure/thermostat ${money(opt.adder)}`+
    `${ot?" + overtemperature Type J "+money(215):""}`+
    `${pt?" + process Type J "+money(178):""}`+
    ` · ${opt.label}`;
}

$("flange").addEventListener("change",syncPrimary);
$("elements").addEventListener("change",syncAfterElements);
$("material").addEventListener("change",syncAfterMaterial);
$("voltage").addEventListener("change",syncAfterVoltage);
$("phase").addEventListener("change",syncKw);
$("kw").addEventListener("change",updateResult);
$("thermostat").addEventListener("change",()=>{ syncOptionAvailability(); updateResult(); });
["enclosure","overtemp","processTc"].forEach(id=>$(id).addEventListener("change",updateResult));

$("copyBtn").addEventListener("click",async()=>{
  const text=$("partNumber").textContent;
  try {
    await navigator.clipboard.writeText(text);
    $("copyBtn").textContent="Copied";
    setTimeout(()=>$("copyBtn").textContent="Copy",1000);
  } catch(e) {
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
});

syncPrimary();
</script>
