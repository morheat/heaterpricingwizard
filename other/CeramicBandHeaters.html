        function calculatePrice() {
            const seriesKey = document.getElementById('heaterSeries').value;
            const diameter = parseFloat(document.getElementById('diameter').value);
            const width = parseFloat(document.getElementById('width').value);

            const cat = matrices[seriesKey];
            let basePrice = 0;

            let dIndex = cat.diameters.indexOf(diameter);
            let wIndex = widthsArr.indexOf(width);

            if (dIndex !== -1 && wIndex !== -1) {
                basePrice = cat.matrix[dIndex][wIndex];
            } else {
                let closestD = Math.min(Math.max(diameter, 3), 16);
                let closestW = Math.min(Math.max(width, 1.5), 12);
                let dIdx = cat.diameters.indexOf(closestD);
                let wIdx = widthsArr.indexOf(closestW);
                
                basePrice = cat.matrix[dIdx][wIdx];

                if (width > 12) {
                    let diff = width - 12;
                    basePrice += diff * cat.addlInches[wIdx];
                }
            }

            let optionsCost = 0;
            if (document.getElementById('optDualVolt').checked) optionsCost += 19.31;
            if (document.getElementById('optThreePhase').checked) optionsCost += 19.32;

            const leadType = document.getElementById('leadType').value;
            const leadInches = parseInt(document.getElementById('leadInches').value) || 12;
            let dualInches = Math.max(1, Math.ceil(leadInches / 2));

            if (leadType === "18ga") optionsCost += dualInches * 0.72;
            else if (leadType === "16ga") optionsCost += dualInches * 0.90;
            else if (leadType === "14ga") optionsCost += dualInches * 1.19;

            if (document.getElementById('optTerminalBox').checked) optionsCost += 41.50;
            if (document.getElementById('optCustomTerminalBox').checked) optionsCost += 64.90;

            const leadProt = document.getElementById('leadProt').value;
            const protLength = parseInt(document.getElementById('protLength').value) || 0;
            if (leadProt === "braid") optionsCost += protLength * 0.55;
            else if (leadProt === "conduit") optionsCost += protLength * 0.55;

            if (document.getElementById('optEuroPlug').checked) optionsCost += 90.21;
            if (document.getElementById('optGroundTerm').checked) optionsCost += 15.15;
            if (document.getElementById('optGroundWireConst').checked) {
                optionsCost += 15.15 + (leadInches * 0.36);
            }

            const clamping = document.getElementById('clamping').value;
            if (clamping === "springLoaded") optionsCost += 26.80;
            else if (clamping === "latch3") optionsCost += 102.71;
            else if (clamping === "latch6") optionsCost += 205.42;
            else if (clamping === "latch9") optionsCost += 308.13;
            else if (clamping === "latch12") optionsCost += 410.84;

            if (document.getElementById('optHole').checked) optionsCost += 39.71;
            if (document.getElementById('optBayonetHole').checked) optionsCost += 36.95;

            let baseUnitPrice = basePrice + optionsCost;

            // Quantity tiers derived from ceramic band pricing image:
            // 1 - 1: 1.0000 ($141.03)
            // 2 - 9: 0.8000 ($112.82)
            // 10+: 0.6000 ($84.62)
            const tiers = [
                { range: "1 - 1", mult: 1.0000 },
                { range: "2 - 9", mult: 0.8000 },
                { range: "10+", mult: 0.6000 }
            ];

            document.getElementById('totalPrice').innerText = '$' + baseUnitPrice.toFixed(2);

            let tbody = document.getElementById('qtyTableBody');
            tbody.innerHTML = '';
            tiers.forEach(tier => {
                let tierPrice = baseUnitPrice * tier.mult;
                let tr = document.createElement('tr');
                tr.innerHTML = `<td style="padding: 8px; border-bottom: 1px solid #e2e8f0;">${tier.range}</td>` +
                               `<td style="padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: right;">$${tierPrice.toFixed(2)}</td>`;
                tbody.appendChild(tr);
            });

            let descString = `9.00 in Diameter x 1.5 in Wide, Standard Thickness Ceramic Band Heater 240 V 90 W. With Post Terminals, Flange Lock Up, and a Terminal Box.`;
            document.getElementById('descriptionBlurb').innerText = descString;
        }

        window.onload = function() {
            calculatePrice();
        }

<body>
<div class="back-nav" data-back-nav="true"><a href="index.html">← Back to Other Heaters</a></div>


<div class="container">
    <h1>Ceramic Band Heaters Pricing Calculator</h1>

    <div class="form-group">
        <label for="heaterSeries">Ceramic Band Series</label>
        <select id="heaterSeries" onchange="calculatePrice()">
            <option value="standard" selected>Standard Thickness</option>
            <option value="insMax">Insulation Max</option>
            <option value="ultrathin">Ultrathin</option>
        </select>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="diameter">Inner Diameter (Inches, 3" to 16")</label>
            <input type="number" id="diameter" step="0.5" min="3" max="30" value="9.00" oninput="calculatePrice()" onchange="calculatePrice()">
        </div>

        <div class="form-group">
            <label for="width">Width / Axial Length (Inches, 1.5" to 12")</label>
            <select id="width" onchange="calculatePrice()" oninput="calculatePrice()">
                <option value="1.5" selected>1.5"</option>
                <option value="2">2"</option>
                <option value="2.5">2.5"</option>
                <option value="3">3"</option>
                <option value="3.5">3.5"</option>
                <option value="4">4"</option>
                <option value="4.5">4.5"</option>
                <option value="5">5"</option>
                <option value="6">6"</option>
                <option value="7">7"</option>
                <option value="8">8"</option>
                <option value="9">9"</option>
                <option value="10">10"</option>
                <option value="11">11"</option>
                <option value="12">12"</option>
            </select>
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="leadType">Additional Leads (Wire Gauge)</label>
            <select id="leadType" onchange="calculatePrice()" oninput="calculatePrice()">
                <option value="none" selected>None (Standard Post Terminals)</option>
                <option value="18ga">18 ga (per dual inch) ($0.72)</option>
                <option value="16ga">16 ga (per dual inch) ($0.90)</option>
                <option value="14ga">14 ga (per dual inch) ($1.19)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="leadInches">Lead Length (Inches)</label>
            <input type="number" id="leadInches" min="0" max="120" value="12" oninput="calculatePrice()" onchange="calculatePrice()">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="leadProt">Lead Protection Type</label>
            <select id="leadProt" onchange="calculatePrice()" oninput="calculatePrice()">
                <option value="none" selected>None</option>
                <option value="braid">Stainless Steel Braid ($0.55 / in)</option>
                <option value="conduit">Stainless Steel Conduit ($0.55 / in)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="protLength">Lead Protection Length (Inches)</label>
            <input type="number" id="protLength" min="0" max="120" value="0" oninput="calculatePrice()" onchange="calculatePrice()">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="clamping">Clamping Options</label>
            <select id="clamping" onchange="calculatePrice()" oninput="calculatePrice()">
                <option value="flangeLock" selected>Flange lock up / Welded on barrel nuts (N/C)</option>
                <option value="springLoaded">Spring loaded barrel nuts ($26.80)</option>
                <option value="latch3">Latch and Trunion (Up to 3" wide) - $102.71</option>
                <option value="latch6">Latch and Trunion (3.25"-6" wide) - $205.42</option>
                <option value="latch9">Latch and Trunion (6.25"-9" wide) - $308.13</option>
                <option value="latch12">Latch and Trunion (9.25"-12" wide) - $410.84</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Options</label>
        <div class="checkbox-grid">
            <div class="checkbox-item">
                <input type="checkbox" id="optDualVolt" onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="optDualVolt">Dual Voltage Construction ($19.31)</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optThreePhase" onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="optThreePhase">Three Phase Construction ($19.32)</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optTerminalBox" checked onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="optTerminalBox">Terminal Box ($41.50)</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optCustomTerminalBox" onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="optCustomTerminalBox">Custom Terminal Box ($64.90)</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optEuroPlug" onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="optEuroPlug">Euro Plug ($90.21)</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optGroundTerm" onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="optGroundTerm">Ground Terminal ($15.15)</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optGroundWireConst" onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="optGroundWireConst">Ground Wire Construction ($15.15 + $0.36/in)</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optHole" onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="optHole">Hole less than 3" diameter ($39.71)</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="optBayonetHole" onchange="calculatePrice()" oninput="calculatePrice()">
                <label for="optBayonetHole">Bayonet Adapter w/ hole in heater ($36.95)</label>
            </div>
        </div>
    </div>

    <div class="summary-card">
        <h2>List Price</h2>
        <div class="total-price" id="totalPrice">$0.00</div>
    </div>

    <div style="margin-top: 25px;">

        <table>
            <thead>
                <tr>
                    <th>Quantity</th>
                    <th style="text-align: right;">Unit Price</th>
                </tr>
            </thead>
            <tbody id="qtyTableBody">
                <!-- Dynamically populated -->
            </tbody>
        </table>
    </div>

    <div class="desc-box">
        <h3>Description</h3>
        <p id="descriptionBlurb" style="margin: 0; color: #4a5568; font-family: monospace;"></p>
    </div>
</div>

</body>
</html>
