        function calculatePrice() {
            const catalogKey = document.getElementById('catalogStyle').value;
            const tcType = document.getElementById('tcType').value;
            const length = parseInt(document.getElementById('length').value) || 1;

            const selectedCatalog = tcCatalogs[catalogKey];
            let basePrice = 0;

            if (selectedCatalog && selectedCatalog.matrix[tcType]) {
                let matrixRow = selectedCatalog.matrix[tcType];
                let addlRates = selectedCatalog.addlFt;

                if (length <= 12) {
                    basePrice = matrixRow[length - 1];
                } else {
                    let diff = length - 12;
                    basePrice = matrixRow[11] + (diff * addlRates[tcType]);
                }
            }

            let optionsCost = 0;
            const extraLeadFt = parseInt(document.getElementById('extraLeadFt').value) || 0;

            if (document.getElementById('optBayonet').checked) optionsCost += 13.79;
            if (document.getElementById('optUngrounded').checked) optionsCost += 6.76;
            if (document.getElementById('optDualElement').checked) optionsCost += 5.03;
            if (document.getElementById('optBX').checked) optionsCost += 10.46;
            
            optionsCost += extraLeadFt * 0.93;

            if (document.getElementById('optStdPlug').checked) optionsCost += 16.95;
            if (document.getElementById('optStdJack').checked) optionsCost += 16.95;
            if (document.getElementById('optMiniPlug').checked) optionsCost += 16.95;
            if (document.getElementById('optMiniJack').checked) optionsCost += 16.95;

            let baseUnitPrice = basePrice + optionsCost;

            // Quantity tiers derived from thermocouple pricing image:
            // 1-1: 1.0000 ($34.34)
            // 2-4: 0.8125 ($27.90)
            // 5-9: 0.6250 ($21.46)
            // 10-24: 0.5000 ($17.17)
            // 25-49: 0.3750 ($12.88)
            // 50-99: 0.3500 ($12.02)
            // 100+: 0.3375 ($11.59)
            const tiers = [
                { range: "1 - 1", mult: 1.0000 },
                { range: "2 - 4", mult: 0.8125 },
                { range: "5 - 9", mult: 0.6250 },
                { range: "10 - 24", mult: 0.5000 },
                { range: "25 - 49", mult: 0.3750 },
                { range: "50 - 99", mult: 0.3500 },
                { range: "100+", mult: 0.3375 }
            ];

            document.getElementById('totalPrice').innerText = '$' + baseUnitPrice.toFixed(2);

            let tbody = document.getElementById('qtyTableBody');
            tbody.innerHTML = '';
            tiers.forEach(tier => {
                let tierPrice = baseUnitPrice * tier.mult;
                let tr = document.createElement('tr');
                tr.innerHTML = `<td style="padding: 8px; border-bottom: 1px solid #e2e8f0;">${tier.range}</td>` +
                               `<td style="padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: right;">$${tierPrice.toFixed(2)}</td>`;
                tbody.appendChild(tr);
            });

            let styleName = selectedCatalog ? selectedCatalog.name : "Adjustable TC";
            let typeName = tcType === "typeJ" ? "Type J" : (tcType === "typeK" ? "Type K" : (tcType === "typeT" ? "Type T" : tcType));
            let groundText = document.getElementById('optUngrounded').checked ? "Ungrounded Construction" : "Grounded Construction";
            let descString = `${styleName}, ${typeName} with ${length} ft. long 24 ga Leads, ${groundText}, with Stripped Ends.`;
            document.getElementById('descriptionBlurb').innerText = descString;
        }

        window.onload = function() {
            calculatePrice();
        }

        <table>

                    <th>Quantity</th>
