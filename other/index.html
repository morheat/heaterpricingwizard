<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Wizard</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .link-item {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        .link-item:hover {
            border-color: var(--secondary-color);
            box-shadow: 0 2px 4px rgba(43, 108, 176, 0.1);
        }
        .link-info a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            display: block;
        }
        .link-info a:hover {
            text-decoration: underline;
        }
        .link-path {
            font-size: 12px;
            color: #718096;
            margin-top: 4px;
            font-family: monospace;
        }
        .item-number {
            font-weight: bold;
            color: #a0aec0;
            font-size: 14px;
            margin-right: 15px;
            min-width: 24px;
        }
    
        .back-nav {
            max-width: 800px;
            margin: 0 auto 14px;
        }
        .back-nav a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #2b6cb0;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-nav a:hover {
            text-decoration: underline;
        }
</style>
    <script>
        // Exactly 14 calculator entries. Edit names and URLs here directly.
        const calculators = [
            { name: "Hotrod", url: "hotrod.html" },
            { name: "Non-Swagged Heaters", url: "Non-Swaged.html" },
            { name: "Starflex", url: "starflex.html" },
            { name: "Mica Band Heater", url: "MicaBandHeaters.html" },
            { name: "Nozzle Heater", url: "NozzleHeaters.html" },
            { name: "Silicone Rubber", url: "SiliconeRubber.html" },
            { name: "Mica Strip Heater", url: "StripHeater.html" },
            { name: "Ceramic Strip Heater", url: "CeramicStripHeater.html" },
            { name: "Air Heater", url: "AirHeater.html" },
            { name: "BasicTC", url: "BasicTC.html" },
            { name: "Mineral Insulated TC", url: "InsulatedTC.html" },
            { name: "CoilHeaters", url: "CoilHeaters.html" },
            { name: "Square Cartridge Heater", url: "SquareCartridgeHeaters.html" },
            { name: "Ceramic Band Heater", url: "CeramicBandHeaters.html" }
        ];

        function renderLinks() {
            const listEl = document.getElementById('linkList');
            listEl.innerHTML = '';

            calculators.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'link-item';
                
                const leftDiv = document.createElement('div');
                leftDiv.style.display = 'flex';
                leftDiv.style.alignItems = 'center';

                const numSpan = document.createElement('span');
                numSpan.className = 'item-number';
                numSpan.innerText = (index + 1) + '.';

                const infoDiv = document.createElement('div');
                infoDiv.className = 'link-info';

                const a = document.createElement('a');
                a.href = item.url;
                a.target = '_blank';
                a.innerText = item.name;

                const pathDiv = document.createElement('div');
                pathDiv.className = 'link-path';
               // pathDiv.innerText = 'File: ' + item.url;

                infoDiv.appendChild(a);
                infoDiv.appendChild(pathDiv);

                leftDiv.appendChild(numSpan);
                leftDiv.appendChild(infoDiv);

                li.appendChild(leftDiv);
                listEl.appendChild(li);
            });
        }

        window.onload = renderLinks;
    </script>
</head>
<body>
<div class="back-nav" data-back-nav="true"><a href="../index.html">← Back to Heater Pricing Wizard</a></div>


<div class="container">
    <h1>Heater Pricing Wizard</h1>


    <ul id="linkList" class="link-list">
        <!-- Dynamically populated from the script array -->
    </ul>
</div>

</body>
</html>
