<head>

<title>Heater Pricing Wizard</title>
<style>
:root { --primary-color:#1a365d; --secondary-color:#2b6cb0; --bg-color:#f7fafc; --card-bg:#ffffff; --text-color:#2d3748; --border-color:#e2e8f0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg-color); color:var(--text-color); line-height:1.5; margin:0; padding:40px 20px; }

.subtitle { text-align:center; color:#718096; font-size:14px; margin-bottom:30px; }
.choice { display:block; background:#f8fafc; border:1px solid var(--border-color); padding:18px 20px; border-radius:6px; margin-bottom:14px; color:var(--secondary-color); text-decoration:none; font-weight:600; font-size:18px; transition:all .2s ease; }
