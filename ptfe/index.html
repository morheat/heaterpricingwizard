<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Wizard</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .link-item {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        .link-item:hover {
            border-color: var(--secondary-color);
            box-shadow: 0 2px 4px rgba(43, 108, 176, 0.1);
        }
        .link-info a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            display: block;
        }
        .link-info a:hover {
            text-decoration: underline;
        }
        .link-path {
            font-size: 12px;
            color: #718096;
            margin-top: 4px;
            font-family: monospace;
        }
        .item-number {
            font-weight: bold;
            color: #a0aec0;
            font-size: 14px;
            margin-right: 15px;
            min-width: 24px;
        }
        
    </style>
    <script>
        // Exactly 14 calculator entries. Edit names and URLs here directly.
        const calculators = [
            { name: "3HX", url: "3HX.html" },
            { name: "3HXO", url: "3HXO.html" },
            { name: "3HXOL", url: "3HXOL.html" },
            { name: "6HX", url: "6HX.html" },
            { name: "9HX", url: "9HX.html" },
            { name: "HX", url: "HX.html" },
            { name: "HXF", url: "HXF.html" },
            { name: "HXFL", url: "HXFL.html" },
            { name: "HXL", url: "HXL.html" },
            { name: "HXO", url: "HXO.html" },
            { name: "HXOL", url: "HXOL.html" },
            { name: "HXRL", url: "HXRL.html" },
            { name: "HXSL", url: "HXSL.html" }
      
        ];

        function renderLinks() {
            const listEl = document.getElementById('linkList');
            listEl.innerHTML = '';

            calculators.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'link-item';
                
                const leftDiv = document.createElement('div');
                leftDiv.style.display = 'flex';
                leftDiv.style.alignItems = 'center';

                const numSpan = document.createElement('span');
                numSpan.className = 'item-number';
                numSpan.innerText = (index + 1) + '.';

                const infoDiv = document.createElement('div');
                infoDiv.className = 'link-info';

                const a = document.createElement('a');
                a.href = item.url;
                a.innerText = item.name;

                const pathDiv = document.createElement('div');
                pathDiv.className = 'link-path';
               // pathDiv.innerText = 'File: ' + item.url;

                infoDiv.appendChild(a);
                infoDiv.appendChild(pathDiv);

                leftDiv.appendChild(numSpan);
                leftDiv.appendChild(infoDiv);

                li.appendChild(leftDiv);
                listEl.appendChild(li);
            });
        }

        window.onload = renderLinks;
    </script>
</head>
<body>

<div class="container">
    <a href="../index.html" style="display:inline-block;margin-bottom:12px;color:#2b6cb0;text-decoration:none;font-size:14px;">← All heater types</a>
    <h1>Heater Pricing Wizard</h1>


    <ul id="linkList" class="link-list">
        <!-- Dynamically populated from the script array -->
    </ul>
</div>

</body>
</html>
