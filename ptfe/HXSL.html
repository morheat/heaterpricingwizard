<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HXSL Series Heater Pricing Wizard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .info-box { background-color: #fef9e7; border-left: 4px solid #f1c40f; padding: 10px; margin-bottom: 20px; font-size: 14px; color: #7f8c8d; }
        .results { margin-top: 30px; padding: 20px; background: #e8f4f8; border-radius: 8px; border-left: 5px solid #3498db; }
        .results div { margin-bottom: 10px; font-size: 18px; display: flex; align-items: center; }
        .results span { font-weight: bold; color: #2980b9; }
        
        #copy-btn { margin-left: 15px; padding: 4px 12px; font-size: 14px; cursor: pointer; border: 1px solid #bdc3c7; background-color: #fff; color: #2c3e50; border-radius: 4px; transition: all 0.2s; }
        #copy-btn:hover { background-color: #ecf0f1; }
        #copy-btn.copied { background-color: #2ecc71; color: white; border-color: #27ae60; }

        .description-box {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #bdc3c7;
            font-size: 15px !important;
            color: #2c3e50;
            display: block !important;
            line-height: 1.5;
        }
        .description-box span {
            color: #333;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="display:inline-block; margin-bottom:15px; color:#2980b9; text-decoration:none; font-size:14px;">← Back to PTFE heaters</a>
    <h1>HXSL Series Pricing Wizard (Single Phase)</h1>

    <div class="form-group">
        <label for="wattage">Wattage (W)</label>
        <select id="wattage" onchange="calculate()">
            <option value="1000">1000</option>
            <option value="2000">2000</option>
            <option value="3000">3000</option>
            <option value="4000">4000</option>
            <option value="5000">5000</option>
            <option value="6000">6000</option>
        </select>
    </div>

    <div class="form-group">
        <label for="voltage">Voltage (V)</label>
        <select id="voltage" onchange="calculate()">
            <option value="120">120V</option>
            <option value="200">200V</option>
            <option value="208">208V</option>
            <option value="220">220V</option>
            <option value="240" selected>240V</option>
            <option value="380">380V</option>
            <option value="415">415V</option>
            <option value="480">480V</option>
            <option value="600">600V</option>
            <option value="700">700V</option>
        </select>
    </div>

    <div class="form-group">
        <label for="fuse">Fuse</label>
        <select id="fuse" onchange="calculate()">
            <option value="P1">P1</option>
            <option value="P2">P2</option>
            <option value="P3">P3</option>
            <option value="P4">P4</option>
            <option value="P8">P8 (+$48)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="conduit">Flexible lead length (Inches)</label>
        <input type="number" id="conduit" value="48" min="1" oninput="calculate()">
    </div>

    <div class="results">
        <div>
            Part Number: <span id="out-part" style="margin-left: 5px;"></span>
            <button id="copy-btn" onclick="copyPart()">Copy</button>
        </div>
        <div>Current (1-Phase): <span id="out-amps" style="margin-left: 5px;"></span> A</div>
        <div>Retail Price: $<span id="out-price" style="margin-left: 5px;"></span></div>
        <div>Distributor Price: $<span id="out-dist-price" style="margin-left: 5px;"></span></div>
        <div class="description-box">
            <strong>Description:</strong><br>
            <span id="out-desc"></span>
        </div>
    </div>
</div>

<script>
    // Base Prices by Wattage
    const basePrices = {
        1000: 1380,
        2000: 1465,
        3000: 2031,
        4000: 2128,
        5000: 2460,
        6000: 2742
    };

    // Voltage Keys for Part Number Generation
    const voltageCodes = {
        120: "1",
        240: "2",
        380: "3",
        480: "4",
        415: "5",
        600: "6",
        700: "7",
        208: "8",
        220: "9",
        200: "0" 
    };

    // Fuse type mapping for description
    const fuseMap = {
        "P1": "P1 Replaceable Fuse (190degF)",
        "P4": "P4 Replaceable Fuse (220degF)",
        "P2": "P2 Resettable Fuse (190degF)",
        "P3": "P3 Resettable Fuse (250degF)",
        "P8": "P8 Resettable Fuse (210degF)"
    };

    function calculate() {
        const wSelect = parseInt(document.getElementById('wattage').value);
        const vSelect = parseInt(document.getElementById('voltage').value);
        const fuse = document.getElementById('fuse').value;
        const flexLength = parseInt(document.getElementById('conduit').value) || 48;
        
        let finalPrice = basePrices[wSelect];

        // Part Number Generation
        // HXSL + [Wattage 1st Digit] + [Voltage Code] - [Fuse]
        const wattageDigit = wSelect / 1000;
        const vCode = voltageCodes[vSelect];
        // Since it's single-phase only, ensure the '1-' prefix is attached to the fuse
        let generatedPart = `HXSL${wattageDigit}${vCode}-1-${fuse}`;

        // Process Fuse Surcharge
        if (fuse === 'P8') {
            finalPrice += 48;
        }

        // Flex Lead Selection ($7 per inch over 48 inches)
        if (flexLength > 48) {
            generatedPart += "-X" + flexLength;
            const extraInches = flexLength - 48;
            finalPrice += (extraInches * 7); 
        }

        // Calculations
        const amps = wSelect / vSelect;
        const distributorPrice = finalPrice * 0.65;

        // Generate Description String
        // Series, Voltage, Phase, Wattage, Conduit Length, Fuse type
        const seriesDesc = "Custom Flex Riser PTFE Heaters";
        const voltageDesc = vSelect + "V";
        const phaseDesc = "Single Phase";
        const wattageDesc = wSelect + "W";
        const conduitDesc = flexLength + '" Teflon conduit';
        const fuseDesc = fuseMap[fuse];

        const descriptionString = `${seriesDesc}, ${voltageDesc}, ${phaseDesc}, ${wattageDesc}, ${conduitDesc}, ${fuseDesc}`;

        // Output Values
        document.getElementById('out-part').innerText = generatedPart;
        document.getElementById('out-amps').innerText = amps.toFixed(2);
        document.getElementById('out-price').innerText = finalPrice.toFixed(2);
        document.getElementById('out-dist-price').innerText = distributorPrice.toFixed(2);
        document.getElementById('out-desc').innerText = descriptionString;
        
        // Reset Copy Button Styling
        const copyBtn = document.getElementById('copy-btn');
        copyBtn.innerText = 'Copy';
        copyBtn.classList.remove('copied');
    }

    function copyPart() {
        const partText = document.getElementById('out-part').innerText;
        navigator.clipboard.writeText(partText).then(() => {
            const btn = document.getElementById('copy-btn');
            btn.innerText = 'Copied!';
            btn.classList.add('copied');
            
            setTimeout(() => {
                btn.innerText = 'Copy';
                btn.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    }

    // Initialize on load
    window.onload = calculate;
</script>

</body>
</html>
