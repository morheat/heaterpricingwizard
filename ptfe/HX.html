<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HX Series Pricing Wizard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        select, input[type="number"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .checkbox-group { display: flex; align-items: center; margin-top: 10px; margin-bottom: 20px; }
        .checkbox-group input { width: auto; margin-right: 10px; width: 20px; height: 20px; }
        .results { margin-top: 30px; padding: 20px; background: #e8f4f8; border-radius: 8px; border-left: 5px solid #3498db; }
        .results div { margin-bottom: 10px; font-size: 18px; display: flex; align-items: center; }
        .results span { font-weight: bold; color: #2980b9; }
        .hidden { display: none; }
        
        /* New Copy Button Styles */
        #copy-btn {
            margin-left: 15px;
            padding: 4px 12px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #bdc3c7;
            background-color: #fff;
            color: #2c3e50;
            border-radius: 4px;
            transition: all 0.2s;
        }
        #copy-btn:hover {
            background-color: #ecf0f1;
        }
        #copy-btn.copied {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }
        .description-box {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #bdc3c7;
            font-size: 15px !important;
            color: #2c3e50;
            display: block !important;
            line-height: 1.5;
        }
        .description-box span {
            color: #333;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="display:inline-block; margin-bottom:15px; color:#2980b9; text-decoration:none; font-size:14px;">← Back to PTFE heaters</a>
    <h1>HX Series Pricing Wizard (Single Phase)</h1>

    <div class="form-group">
        <label for="wattage">Wattage (W)</label>
        <select id="wattage" onchange="updateVoltages()">
            <option value="500">500</option>
            <option value="1000">1000</option>
            <option value="2000">2000</option>
            <option value="3000">3000</option>
            <option value="4000">4000</option>
            <option value="5000">5000</option>
            <option value="6000">6000</option>
            <option value="8000">8000</option>
            <option value="9000">9000</option>
        </select>
    </div>

    <div class="form-group">
        <label for="voltage">Voltage (V)</label>
        <select id="voltage" onchange="updateForm()"></select>
    </div>

    <div class="form-group">
        <label for="fuse">Fuse</label>
        <select id="fuse" onchange="calculate()">
            <option value="P1">P1</option>
            <option value="P2">P2</option>
            <option value="P3">P3</option>
            <option value="P8">P8 (+$48)</option>
        </select>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="guard" onchange="calculate()">
        <label for="guard" style="margin-bottom: 0;">Include Guard?</label>
    </div>

    <div class="form-group" id="overall-length-group">
        <label for="length">Overall Length (inches)</label>
        <input type="number" id="length" min="1" oninput="calculate()">
    </div>

    <div class="form-group">
        <label for="conduit">Conduit Length (inches)</label>
        <input type="number" id="conduit" value="36" min="1" oninput="calculate()">
    </div>

    <div class="results">
        <div>
            Part Number: <span id="out-part" style="margin-left: 5px;"></span>
            <button id="copy-btn" onclick="copyPart()">Copy</button>
        </div>
        <div>Amps: <span id="out-amps" style="margin-left: 5px;"></span> A</div>
        <div>Retail Price: $<span id="out-price" style="margin-left: 5px;"></span></div>
        <div>Distributor Price: $<span id="out-dist-price" style="margin-left: 5px;"></span></div>
        <div class="description-box">
            <strong>Description:</strong><br>
            <span id="out-desc"></span>
        </div>
    </div>
</div>

<script>
    // HX Series Database
    const heaters = [
        { watts: 500,  template: "HX.5{v}11-**",  price: 580,  length: 11, guard: 132 },
        { watts: 1000, template: "HX1{v}11-**",   price: 641,  length: 11, guard: 132 },
        { watts: 2000, template: "HX2{v}17-**",   price: 814,  length: 17, guard: 146 },
        { watts: 3000, template: "HX3{v}23-**",   price: 984,  length: 23, guard: 157 },
        { watts: 4000, template: "HX4{v}29-**",   price: 1328, length: 29, guard: 167 },
        { watts: 5000, template: "HX5{v}35-**",   price: 1569, length: 35, guard: 176 },
        { watts: 6000, template: "HX6{v}40-**",   price: 1716, length: 40, guard: 185 },
        { watts: 8000, template: "2HX8{v}47-**",  price: 2471, length: 47, guard: 208 },
        { watts: 9000, template: "2HX9{v}54-**",  price: 2642, length: 54, guard: 225 },
    ];

    const voltageCodes = {
        120: "1",
        240: "2",
        380: "3",
        480: "4",
        415: "5",
        600: "6",
        400: "7",
        208: "8",
        220: "9",
        200: "0"
    };

    // Hotzone mapping for description
    const hotzoneMap = {
        500: '5"',
        1000: '7"',
        2000: '12"',
        3000: '16"',
        4000: '20"',
        5000: '25"',
        6000: '29"',
        8000: '37"',
        9000: '44"'
    };

    // Fuse type mapping for description
    const fuseMap = {
        "P1": "P1 Replaceable Fuse (190degF)",
        "P2": "P2 Resettable Fuse (190degF)",
        "P3": "P3 Resettable Fuse (250degF)",
        "P8": "P8 Resettable Fuse (210degF)"
    };

    function updateVoltages() {
        const wSelect = parseInt(document.getElementById('wattage').value);
        const vSelect = document.getElementById('voltage');
        vSelect.innerHTML = ''; 

        const allVoltages = [120, 200, 208, 220, 240, 380, 400, 415, 480, 600];
        
        allVoltages.forEach(v => {
            if (v === 600 && (wSelect === 5000 || wSelect === 6000)) {
                return; 
            }
            let opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v + "V";
            vSelect.appendChild(opt);
        });

        updateForm();
    }

    function updateForm() {
        const wSelect = parseInt(document.getElementById('wattage').value);
        
        const heater = heaters.find(h => h.watts === wSelect);
        if (!heater) return;

        document.getElementById('length').value = heater.length;
        document.getElementById('length').min = heater.length; 

        calculate();
    }

    function calculate() {
        const wSelect = parseInt(document.getElementById('wattage').value);
        const vSelect = parseInt(document.getElementById('voltage').value);
        const fuse = document.getElementById('fuse').value;
        const includeGuard = document.getElementById('guard').checked;
        const conduitLength = parseInt(document.getElementById('conduit').value) || 36;
        
        const heater = heaters.find(h => h.watts === wSelect);
        if (!heater) return;

        let finalPrice = heater.price;
        let guardPrice = heater.guard;
        
        const vCode = voltageCodes[vSelect] || "1";
        let generatedPart = heater.template.replace('{v}', vCode);

        const customLength = parseInt(document.getElementById('length').value) || heater.length;

        if (customLength > heater.length) {
            const extraInches = customLength - heater.length;
            const is2HX = heater.template.startsWith('2HX');
            
            finalPrice += extraInches * (is2HX ? 8 : 3);
            guardPrice += extraInches * 1; 

            generatedPart = generatedPart.replace(heater.length + '-**', customLength + '-**');
        }

        generatedPart = generatedPart.replace('**', fuse);

        if (fuse === 'P8') {
            finalPrice += 48;
        }

        if (includeGuard) {
            finalPrice += guardPrice;
        }

        if (conduitLength > 36) {
            generatedPart += "-X" + conduitLength;
            const extraFeet = (conduitLength - 36) / 12;
            finalPrice += (extraFeet * 10); 
        }

        const amps = (wSelect / vSelect).toFixed(2);

        const distributorPrice = finalPrice * 0.65;

        // Generate Description String
        const seriesDesc = "Spiral PTFE Heater";
        const voltageDesc = vSelect + "V";
        const phaseDesc = "Single Phase";
        const wattageDesc = wSelect + "W";
        const hotzoneDesc = hotzoneMap[wSelect] + " hotzone";
        const oalDesc = customLength + '" OAL';
        const conduitDesc = conduitLength + '" Teflon conduit';
        const fuseDesc = fuseMap[fuse];

        const descriptionString = `${seriesDesc}, ${voltageDesc}, ${phaseDesc}, ${wattageDesc}, ${hotzoneDesc}, ${oalDesc}, ${conduitDesc}, ${fuseDesc}`;

        // Output Values
        document.getElementById('out-part').innerText = generatedPart;
        document.getElementById('out-amps').innerText = amps;
        document.getElementById('out-price').innerText = finalPrice.toFixed(2);
        document.getElementById('out-dist-price').innerText = distributorPrice.toFixed(2);
        document.getElementById('out-desc').innerText = descriptionString;
        
        const copyBtn = document.getElementById('copy-btn');
        copyBtn.innerText = 'Copy';
        copyBtn.classList.remove('copied');
    }

    function copyPart() {
        const partText = document.getElementById('out-part').innerText;
        navigator.clipboard.writeText(partText).then(() => {
            const btn = document.getElementById('copy-btn');
            btn.innerText = 'Copied!';
            btn.classList.add('copied');
            
            setTimeout(() => {
                btn.innerText = 'Copy';
                btn.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    }

    window.onload = updateVoltages;
</script>

</body>
</html>
